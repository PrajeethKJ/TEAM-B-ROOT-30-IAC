<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      background: #0b0f19;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    h3 {
      margin: 0 0 4px 0;
      font-size: 14px;
      color: #38bdf8;
    }
    p {
      margin: 0 0 12px 0;
      font-size: 11px;
      color: #94a3b8;
    }
    .status-box {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      margin-bottom: 12px;
    }
    .status-text {
      font-size: 13px;
      font-weight: 700;
      color: #34d399;
    }
    .btn {
      display: block;
      width: 100%;
      background: #06b6d4;
      color: #0b0f19;
      border: none;
      border-radius: 6px;
      padding: 8px 0;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h3>BioPrint Defense Core</h3>
  <p>Behavioral Biometric Protection</p>
  <div class="status-box">
    <div style="font-size: 10px; color: #94a3b8; text-transform: uppercase;">Engine Status</div>
    <div class="status-text" id="statusText">Shield Active</div>
  </div>
  <a class="btn" href="http://localhost:8000" target="_blank">Open BioPrint Dashboard</a>
</body>
</html>
